<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your music</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/studio.webmanifest">
<link rel="apple-touch-icon" href="/studio/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Your music">
<style>
/* Amply — design system.
   Light only, deliberately. A theme toggle is a thing to maintain and a thing
   to get wrong, and this site is a handful of pages that need to be clear
   rather than clever. Text on orange is ink, not white — the orange is too light for white
   to pass contrast. */

:root {
  color-scheme: light only;
  --orange:    #f6711e;
  --on-orange: #131110;
  --bg:        #ffffff;
  --bg2:       #f7f4f1;
  --ink:       #131110;
  --ink2:      #4a4644;
  --ink3:      #66615d;
  --line:      #e3ddd8;
  --deep:      #131110;   /* full-bleed dark panels */
  --on-deep:   #faf7f5;

  --r:    14px;
  --r-lg: 18px;
  --pill: 999px;

  --col:  1300px;         /* homepage content column */
  --col-narrow: 800px;    /* the setup flow reads as a single column */
  --gut:  clamp(20px, 4vw, 48px);

  --sans: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ── layout ───────────────────────────────────────────────────────── */

.col     { max-width: var(--col);        margin: 0 auto; padding: 0 var(--gut); }
.col.narrow { max-width: var(--col-narrow); }
.bleed   { width: 100%; }
section  { padding: clamp(46px, 5.5vw, 86px) 0; }

/* Consecutive sections would each contribute a full pad, doubling the gap
   between them. One gap, not two. */
section + section { padding-top: 0; }

/* ── header ───────────────────────────────────────────────────────── */

.topbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 17px var(--gut);
}
.mark {
  display: inline-flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 25px; letter-spacing: -0.035em;
  color: var(--ink); text-decoration: none;
}
.mark svg { width: 26px; height: 26px; display: block; color: var(--orange); }
.topbar-actions { display: flex; align-items: center; gap: 10px; }

/* ── type ─────────────────────────────────────────────────────────── */

h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 {
  font-weight: 800; letter-spacing: -0.042em; line-height: 0.94;
  font-size: clamp(44px, 8.4vw, 118px);
}
h1.step { font-size: clamp(38px, 5.6vw, 76px); line-height: 0.98; letter-spacing: -0.038em; }
h2 { font-weight: 800; letter-spacing: -0.038em; line-height: 1.02; font-size: clamp(32px, 6.5vw, 76px); }
h3 { font-weight: 700; letter-spacing: -0.025em; font-size: clamp(21px, 2vw, 26px); }

p { margin: 0 0 18px; color: var(--ink2); }
p.lead { font-size: clamp(18px, 1.6vw, 21px); max-width: 34em; }
.orange { color: var(--orange); }
.muted  { color: var(--ink3); }
.mono   { font-family: var(--mono); }
.eyebrow {
  font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink3); margin: 0 0 22px;
}
a { color: var(--orange); text-underline-offset: 2px; }
strong { font-weight: 600; color: var(--ink); }

/* ── buttons ──────────────────────────────────────────────────────── */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font: inherit; font-weight: 700; font-size: 19px; letter-spacing: -0.01em;
  background: var(--orange); color: var(--on-orange);
  border: 0; padding: 19px 34px; border-radius: var(--pill);
  cursor: pointer; text-decoration: none;
  transition: filter .12s ease, transform .08s ease;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 3px; }
.btn[disabled] { opacity: .35; cursor: not-allowed; filter: none; transform: none; }
.btn.ghost {
  background: transparent; color: var(--ink); border: 1.5px solid var(--line);
  font-family: var(--mono); font-weight: 400; font-size: 15px; padding: 11px 22px;
}
.btn.sm { font-size: 16px; padding: 13px 24px; }
.link {
  background: none; border: 0; font: inherit; font-size: 16px; color: var(--ink3);
  cursor: pointer; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px;
}
.link:hover { color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }

/* ── panels ───────────────────────────────────────────────────────── */

.panel-orange { background: var(--orange); color: var(--on-orange); }
.panel-orange p, .panel-orange .muted { color: rgba(19, 17, 16, 0.74); }
.panel-deep   { background: var(--deep); color: var(--on-deep); }
.panel-deep p { color: rgba(250, 247, 245, 0.62); }

.card {
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 30px;
}
.card > :last-child { margin-bottom: 0; }
.card.orange { background: var(--orange); border-color: transparent; color: var(--on-orange); }
.card.orange p { color: rgba(19, 17, 16, 0.76); }

/* ── rows (numbered list items in the flow) ───────────────────────── */

.rows { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.rows li {
  display: flex; align-items: center; gap: 22px;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: var(--r); padding: 22px 26px;
  font-size: 19px; color: var(--ink);
}
.rows .n { font-weight: 800; font-size: 21px; color: var(--orange); flex: none; min-width: 26px; }
.rows .t { flex: 1; min-width: 0; }
.rows .meta { font-family: var(--mono); font-size: 15px; color: var(--ink3); flex: none; }

/* ── reading pages: privacy, terms, protecting your music ─────────── */

/* A warm band with the page's name, so each of these reads as a page of its
   own rather than a paragraph that starts under the logo. */
.page-head {
  background: var(--bg2); border-bottom: 1px solid var(--line);
  padding: clamp(44px, 6vw, 84px) 0 clamp(36px, 5vw, 60px);
}
.page-head .eyebrow { margin-bottom: 18px; }
.page-head h1 {
  font-size: clamp(38px, 5.6vw, 72px); line-height: 0.98; letter-spacing: -0.038em;
  margin-bottom: 24px;
}
.page-head .lead { margin: 0; color: var(--ink2); }

/* Body copy. The global h2 is sized for the homepage and carries no margin,
   which on a page of prose runs each heading straight into its paragraph. */
.prose { padding: clamp(40px, 5vw, 64px) 0 120px; }
.prose h2 {
  font-size: clamp(25px, 2.6vw, 32px); line-height: 1.1; letter-spacing: -0.03em;
  margin: 52px 0 16px;
}
.prose .col > :first-child { margin-top: 0; }
.prose p, .prose li { max-width: 40em; }
.prose ul, .prose ol:not(.ladder) { padding-left: 1.3em; color: var(--ink2); }
.prose li { margin-bottom: 8px; }
.prose pre {
  background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px 20px; overflow-x: auto; margin: 0 0 22px;
  font-family: var(--mono); font-size: 13.5px; line-height: 1.6; white-space: pre-wrap;
}

.prose p code, .prose li code {
  font-family: var(--mono); font-size: 0.88em;
  background: var(--bg2); padding: 1px 6px; border-radius: 6px;
}

/* A point that needs to stand out from the prose around it. */
.box {
  background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 20px 24px; margin: 0 0 26px;
}
.box p { margin: 0 0 10px; }
.box p:last-child { margin-bottom: 0; }

/* Numbered steps on a line: the escalation on /protect, in the order to try
   them. The number sits on the line, so the indent is the line, not a gap. */
ol.ladder { counter-reset: step; list-style: none; padding: 0; margin: 8px 0 28px; }
ol.ladder > li {
  position: relative; margin-left: 14px; padding: 0 0 28px 32px;
  border-left: 2px solid var(--line);
}
ol.ladder > li:last-child { border-left-color: transparent; padding-bottom: 0; }
ol.ladder > li::before {
  counter-increment: step; content: counter(step);
  position: absolute; left: -15px; top: -1px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--orange); color: var(--on-orange);
  font-size: 14px; font-weight: 700; display: grid; place-items: center;
}
ol.ladder h3 { margin: 0 0 6px; font-size: 19px; line-height: 1.35; }
ol.ladder p { margin-bottom: 10px; }

/* ── footer ───────────────────────────────────────────────────────── */

footer { border-top: 1px solid var(--line); }
.footer-in {
  display: flex; justify-content: space-between; align-items: center;
  gap: 20px; flex-wrap: wrap;
  padding: 30px var(--gut);
  font-family: var(--mono); font-size: 15px; color: var(--ink3);
}
.footer-in a { color: var(--ink3); text-decoration: none; }
.footer-in a:hover { color: var(--ink); }
.footer-links { display: flex; gap: 26px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* The artist's workspace.
   Inlined into the self-contained copy served from the artist's own node, so it
   can reference only tokens from style.css, nothing external.

   The public site is white with warm panels. This is the inverse: a warm ground
   with white cards floating on it, because a workspace is a surface you put
   things on rather than a page you read. */

:root {
  --good:     #2c6b45;   /* a split that adds up */
  --bad:      #b03636;   /* an upload that didn't finish */
  --bad-bg:   #fdf1f0;
  --hatch:    #eeeae4;   /* the "nothing here yet" diagonal fill */
}

body {
  background: var(--bg2);
  padding-bottom: 120px;          /* clears the player bar */
}

/* A floor, not a layout. Every picture here is sized by the box that holds it,
   but a picked image is whatever the artist's camera produced, and one styling
   mistake should not put a 4000px photo through the page. */
img { max-width: 100%; }

.wrap { display: block; }

/* ── header ───────────────────────────────────────────────────────── */

.top {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: var(--col); margin: 0 auto; padding: 16px var(--gut);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.top-mark { display: inline-flex; align-items: baseline; gap: 12px; min-width: 0; }
.top-mark .mark { font-size: 24px; }
.top-mark .where {
  font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink3); white-space: nowrap;
}
.top-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }

/* the "N changes not live yet" pill */
.state {
  display: inline-flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); border-radius: var(--pill);
  padding: 10px 20px; font-size: 16px; font-weight: 600; color: var(--ink);
  background: var(--bg);
}
.state .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--orange); flex: none; }
.state.clean { color: var(--ink3); font-weight: 400; }
.state .short, .publish .short { display: none; }
.page-links { display: none; }
.state.clean .dot { background: var(--line); }

/* ── tabs ─────────────────────────────────────────────────────────── */

/* Inside .top, so the whole bar sticks as one piece and there is no hand-tuned
   offset to fall out of step with the header's height. */
.tabs-in {
  max-width: var(--col); margin: 0 auto; padding: 0 var(--gut);
  display: flex; align-items: stretch; justify-content: space-between; gap: 20px;
  border-top: 1px solid var(--line);
}
.tablist { display: flex; gap: 8px; }
.tab {
  background: none; border: 0; font: inherit; font-size: 19px; font-weight: 600;
  letter-spacing: -0.02em; color: var(--ink3); cursor: pointer;
  padding: 14px 16px 11px; border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--orange); }
.tab:focus-visible { outline: 2.5px solid var(--orange); outline-offset: -3px; }

.tabs-right { display: flex; align-items: center; gap: 22px; }
.quiet-link {
  font-family: var(--mono); font-size: 14px; color: var(--orange);
  background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none;
  white-space: nowrap;
}
.quiet-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.quiet-link.done { color: var(--good); }

/* ── page body ────────────────────────────────────────────────────── */

.page { max-width: var(--col); margin: 0 auto; padding: 42px var(--gut) 0; }
.page-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 20px; flex-wrap: wrap; margin-bottom: 26px;
}
.page-head h1 {
  font-size: clamp(34px, 4.4vw, 52px); line-height: 1; letter-spacing: -0.035em;
  display: inline-flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
}
.page-head .count { font-family: var(--mono); font-size: 15px; font-weight: 400; color: var(--ink3); letter-spacing: 0; }
/* The site's own .page-head (a banner with padding and a rule under it) is in
   the shared stylesheet too; in the editor it's just a heading row. */
.page .page-head { padding: 0; border: 0; background: none; }
.page .page-head h1 { margin: 0; }

.stack { display: grid; gap: 20px; }

/* Cards here float on the warm ground, so they are white and the fields inside
   them are warm. That is the opposite of the public site and deliberate. */
.card {
  background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 26px;
}
.card h2 {
  margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -0.025em;
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
.card h2 .note {
  font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink3); font-weight: 400;
}
.card > p { font-size: 16.5px; }
.card > p:last-child { margin-bottom: 0; }

/* A quiet question mark: the reasoning lives on the website, where it can be
   improved without every artist rebuilding their node. */
.why {
  display: inline-grid; place-items: center; width: 20px; height: 20px;
  border-radius: 50%; background: var(--bg2); color: var(--ink3);
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  text-decoration: none; flex: none; align-self: center;
}
.why:hover, .why.on { background: var(--orange); color: var(--on-orange); }
button.why { border: 0; padding: 0; cursor: pointer; vertical-align: middle; margin-left: 4px; }
/* What a ? opens: right under the heading or label it belongs to. */
.help {
  display: block; margin: 10px 0 4px; padding: 12px 14px; border-radius: var(--r);
  background: var(--bg2); color: var(--ink2);
  font-family: var(--sans, inherit); font-size: 15px; font-weight: 400; line-height: 1.5;
  letter-spacing: 0; text-transform: none;
}
.help a { color: var(--orange); }
.field-label .help { margin-bottom: 8px; }
/* The Stripe App, as three steps. */
.stripe-steps { margin: 4px 0 16px; padding-left: 22px; display: grid; gap: 8px; font-size: 15.5px; }
.stripe-steps .btn { margin-left: 2px; }
details.try-it summary { cursor: pointer; font-weight: 600; }

/* ── form controls ────────────────────────────────────────────────── */

input[type=text], input[type=number], input[type=date], input[type=url], input[type=password],
textarea, select {
  width: 100%; font: inherit; font-size: 16px; padding: 12px 14px;
  border: 1.5px solid transparent; border-radius: var(--r);
  background: var(--bg2); color: var(--ink);
}
input[type=text]:hover, input[type=number]:hover, input[type=password]:hover, textarea:hover { border-color: var(--line); }
input:focus-visible, textarea:focus-visible, select:focus-visible,
button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2.5px solid var(--orange); outline-offset: 1px;
}
textarea { resize: vertical; line-height: 1.5; min-height: 110px; }
::placeholder { color: var(--ink3); opacity: 1; }

.field { display: block; margin: 0 0 18px; }
.field:last-child { margin-bottom: 0; }
.field-label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 7px; }

/* pill buttons, smaller than the marketing ones */
.btn.sm { font-size: 17px; padding: 14px 26px; }
.btn.ghost {
  background: var(--bg); color: var(--ink); border: 1.5px solid var(--line);
  font-family: var(--sans); font-weight: 600; font-size: 16px; padding: 12px 22px;
}
.btn.ghost:hover { border-color: var(--ink3); filter: none; }
.btn.dark { background: var(--deep); color: var(--on-deep); }

/* a square icon button: remove, reorder */
.icon {
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px;
  width: 34px; height: 34px; cursor: pointer; color: var(--ink3);
  font-size: 15px; line-height: 1; display: inline-flex;
  align-items: center; justify-content: center; flex: none;
}
.icon:hover { border-color: var(--ink3); color: var(--ink); }
.icon[disabled] { opacity: .25; cursor: not-allowed; }
.icon.stack2 { width: 22px; height: 18px; border: 0; background: none; font-size: 11px; }

/* ── banners ──────────────────────────────────────────────────────── */

.banner {
  padding: 15px 20px; border-radius: var(--r); font-size: 16px;
  display: flex; justify-content: space-between; gap: 16px; align-items: center;
  margin: 0 0 24px;
}
.banner.ok    { background: rgba(246, 113, 30, .13); color: var(--ink); }
.banner.error { background: var(--bad-bg); color: var(--ink); }
/* Quieter than either: this is worth acting on, but it is not an error and the
   artist's music is working fine. */
.banner.update { background: var(--bg2); color: var(--ink2); border: 1px solid var(--line); }
.banner.update .link { white-space: nowrap; }

/* ── music tab: releases ──────────────────────────────────────────── */

/* Not overflow: hidden. Nothing here needs clipping, and a track's menu has
   to be able to hang below the card's edge. */
.release { padding: 0; }

.release-head {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 22px; padding: 26px; align-items: start;
}
/* The release's date and price: top right, stacked. */
.release-side { display: grid; gap: 10px; justify-items: end; }
.side-field { display: grid; grid-template-columns: auto auto; align-items: center; gap: 10px; }
.side-field .label { font-size: 14px; font-weight: 600; color: var(--ink2); white-space: nowrap; text-align: right; }
.side-field input[type=date] { width: 170px; }
.release-fields .count { display: block; margin-top: 10px; font-family: var(--mono); font-size: 14px; color: var(--ink3); }
.release-art {
  width: 140px; height: 140px; flex: none; border-radius: var(--r);
  background: var(--bg2); border: 1.5px solid transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; cursor: pointer; color: var(--ink3); padding: 0; overflow: hidden;
  font-family: var(--mono); font-size: 12px;
}
.release-art svg { display: block; }
.release-art:hover { border-color: var(--line); color: var(--ink2); }
.release-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.release-art.set { border-style: solid; border-color: var(--line); }

.release-fields { flex: 1 1 260px; min-width: 0; }
.release-title {
  font-size: 22px; font-weight: 700; letter-spacing: -0.025em; padding: 16px 18px;
}

.release-draft {
  margin: 0 26px 18px; padding: 14px 18px; border-radius: var(--r);
  background: var(--bg2); font-size: 15.5px; color: var(--ink2);
}

/* track rows */
.tracks { list-style: none; padding: 0; margin: 0; }
.track { border-top: 1px solid var(--line); }
.track-row {
  display: flex; align-items: center; gap: 16px; padding: 14px 26px;
}
.track-order { display: flex; flex-direction: column; align-items: center; }
.play {
  width: 40px; height: 40px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--ink); background: var(--bg); color: var(--ink);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; line-height: 1; padding: 0;
}
.play:hover { background: var(--ink); color: var(--bg); }
.play[disabled] { opacity: .3; cursor: not-allowed; background: var(--bg); color: var(--ink); }
.play.on { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }

.track-title {
  flex: 1 1 200px; min-width: 0; font-weight: 600; font-size: 17px;
  background: none; padding: 10px 12px;
}
.track-title:hover { background: var(--bg2); }
.track-dur { font-family: var(--mono); font-size: 14px; color: var(--ink3); flex: none; }

/* The heavy-file mark. Orange, like the note it opens: nothing is broken. */
.warn-toggle {
  width: 26px; height: 26px; flex: none; border-radius: 50%; padding: 0;
  border: 0; background: var(--orange); color: var(--on-orange); cursor: pointer;
  font: inherit; font-weight: 800; font-size: 15px; line-height: 26px; text-align: center;
}
.warn-toggle:hover, .warn-toggle[aria-expanded="true"] { background: var(--ink); color: var(--bg); }
/* Each track's Edit button, and the panel it opens under the row. */
.track-edit-btn {
  flex: none; font-size: 14.5px; font-weight: 600; padding: 8px 16px; border-radius: var(--pill);
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
}
.track-edit-btn:hover, .track-edit-btn.on { border-color: var(--orange); color: var(--orange); }
.track-panel {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin: 0 26px 14px; padding: 14px; border-radius: var(--r); background: var(--bg2);
}
.track-panel .btn.ghost { font-size: 15px; padding: 9px 18px; background: var(--bg); }
.track-panel .btn.ghost.danger { color: var(--bad); }
.panel-sale { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel-sale .track-price { display: inline-flex; align-items: center; gap: 8px; }
.panel-sale .label { font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--ink2); }
.panel-sale .money { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); }
.track-mark.sale { background: var(--bg2); color: var(--ink); }
.track-edit-btn .edit-icon { display: none; }
.track-tags { display: contents; }
.track-row .btn.ghost { font-size: 15px; padding: 9px 18px; }

.track-problem {
  background: var(--bad-bg); border-radius: var(--r); margin: 0 26px 16px;
  padding: 16px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.track-problem .what { flex: 1 1 260px; min-width: 0; }
.track-problem strong { display: block; color: var(--bad); font-size: 16.5px; margin-bottom: 3px; }
.track-problem p { margin: 0; font-size: 15.5px; }

/* A heavy file. Orange rather than red: nothing failed, the music is up and
   plays, it is just slow to reach people. */
.track-warn {
  background: rgba(246, 113, 30, .09); border-radius: var(--r); margin: 0 26px 16px;
  padding: 16px 20px;
}
.track-warn strong { display: block; font-size: 16.5px; margin-bottom: 4px; }
.track-warn p { margin: 0 0 8px; font-size: 15.5px; max-width: 62em; }
.track-warn p:last-child { margin-bottom: 0; }

.dropzone {
  margin: 0 26px 26px; padding: 26px; text-align: center;
  border: 1.5px solid transparent; border-radius: var(--r);
  background: var(--bg2); color: var(--ink2); font-size: 16.5px; cursor: pointer;
  width: calc(100% - 52px); font-family: inherit;
}
.dropzone:hover { border-color: var(--line); color: var(--ink); }
.dropzone.over { border-color: var(--orange); color: var(--ink); }

.release-foot {
  display: flex; justify-content: flex-end; padding: 0 26px 22px;
}

/* What's set on a track, at a glance: free, or a price to keep it. */
.track-mark {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  background: rgba(246, 113, 30, .14); color: var(--ink); border-radius: var(--pill);
  padding: 3px 9px; flex: none;
}

/* What a song or an album costs to buy and keep. */
.track-price, .release-price {
  display: inline-flex; align-items: center; gap: 4px; flex: none;
  font-family: var(--mono); font-size: 14px; color: var(--ink2);
}
.track-price input { width: 78px; padding: 6px 8px; font-size: 14px; }
.release-price input { width: 130px; }

/* ── who is listening ─────────────────────────────────────────────── */

table.listeners { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 15.5px; }
table.listeners th {
  text-align: left; font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink3); font-weight: 500;
  padding: 0 12px 10px 0; border-bottom: 1px solid var(--line);
}
table.listeners td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); }
table.listeners td:first-child { font-size: 14px; }
table.listeners tr.blocked td { color: var(--ink3); text-decoration: line-through; }
table.listeners tr.blocked td:last-child { text-decoration: none; }
table.listeners .link { font-size: 15px; }
/* The row's actions: the one that matters most first, the two for handling a
   request about someone's data quieter beside it. Wraps on a phone. */
table.listeners td.row-do { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; }
table.listeners .link.quiet { color: var(--ink3); font-size: 14px; }
table.listeners .link.quiet:hover { color: var(--ink); }
table.listeners .link.danger:hover { color: var(--bad); }
table.listeners td.short { color: var(--bad); font-weight: 600; }
table.listeners tr.blocked td.short { color: var(--ink3); font-weight: 400; }
table.listeners .overdue { display: block; margin-top: 2px; font-size: 12px; font-weight: 600; color: var(--bad); white-space: nowrap; }
table.listeners tr.late td { background: color-mix(in srgb, var(--bad) 6%, transparent); }
table.listeners tr.blocked .overdue { color: var(--ink3); }

/* Connecting Stripe: the exact rows to set, and how to try it. */
table.perms { border-collapse: collapse; margin: 8px 0 4px; font-size: 14px; }
table.perms td { padding: 4px 14px 4px 0; border-bottom: 1px solid var(--line); }
table.perms td:nth-child(2) { font-weight: 600; }
.try-it { background: var(--bg2, #f6f4f1); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
.try-it ol { margin: 8px 0; padding-left: 20px; display: grid; gap: 4px; }
.try-it code { white-space: nowrap; }

/* the line above the table: when payments were last read, and how to look again */
.reconcile {
  display: flex; gap: 12px; align-items: baseline; justify-content: space-between;
  flex-wrap: wrap; margin-top: 16px; font-size: 15px; color: var(--ink2);
}
.reconcile-do { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.icon.refresh { display: inline-flex; align-items: center; justify-content: center; color: var(--ink2); }
.icon.refresh:disabled { opacity: .5; }
.icon.refresh.turning svg { animation: turning 0.9s linear infinite; }
@keyframes turning { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .icon.refresh.turning svg { animation: none; } }

/* Signing out, at the foot of Settings. */
.sign-out { display: flex; justify-content: center; padding: 8px 0 12px; }

/* ── settings tab ─────────────────────────────────────────────────── */

.profile { padding: 0; overflow: hidden; }
/* A button is not centred vertically by default, and this one is a 155px box
   with one line of text in the middle of it. */
.banner-art {
  height: 155px; width: 100%; border: 0; padding: 0 var(--gut); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background-color: var(--bg2);
  background-image: repeating-linear-gradient(
    -45deg, var(--bg2) 0 6px, var(--hatch) 6px 12px);
  font-family: var(--mono); font-size: 13.5px; color: var(--ink3);
  text-align: center; overflow: hidden;
}
.banner-art.set { padding: 0; }
.banner-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.banner-art:hover { color: var(--ink); }

/* Sits astride the cover's bottom edge, a little under half of it above the
   line. No ring: the design does not have one, and the warm fill already
   separates it from both the cover and the white below. */
.avatar-wrap { padding: 0 26px; margin-top: -36px; line-height: 0; }
.avatar {
  width: 88px; height: 88px; border-radius: 50%; padding: 0; cursor: pointer;
  background: var(--bg2); border: 0; overflow: hidden;
  font-family: var(--mono); font-size: 12px; color: var(--ink3); line-height: 1.3;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar:hover { color: var(--ink); }

.profile-fields { padding: 22px 26px 26px; }

.link-row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.link-row .what { flex: 0 1 240px; }
.link-row .where { flex: 1 1 300px; min-width: 0; }

.checkbox {
  display: flex; align-items: center; gap: 10px; margin-top: 22px;
  font-size: 15.5px; color: var(--ink2); cursor: pointer;
}
.checkbox input { width: auto; }

/* price */
.price-grid { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; margin-top: 22px; }
.price-set { flex: 1 1 320px; min-width: 0; }
.price-now { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.price-now .price-input,
.price-now .unit {
  font-size: 54px; font-weight: 800; letter-spacing: -0.045em; color: var(--orange);
  line-height: 1; font-variant-numeric: tabular-nums;
}
.price-now .price-input {
  width: 3.4ch; padding: 0; border: 0; background: none; text-align: right;
  font-family: var(--sans); -moz-appearance: textfield; appearance: textfield;
}
/* The spinners would sit on top of a 54px figure and there is a slider for
   nudging it. */
.price-now .price-input::-webkit-outer-spin-button,
.price-now .price-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.price-now .price-input:hover { background: none; }
.price-now .price-input:focus-visible { outline-offset: 3px; }
.price-now .unit { margin-left: 1px; }
.price-now span:not(.unit) { font-size: 18px; font-weight: 600; margin-left: 8px; }

input[type=range] {
  width: 100%; accent-color: var(--orange); margin: 0; height: 24px;
}
.scale {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 13px; color: var(--ink3); margin-top: 2px;
}
.price-pending {
  background: rgba(246, 113, 30, .09); border-radius: var(--r);
  padding: 14px 18px; font-size: 15.5px; color: var(--ink); margin: 16px 0 0;
}
.price-says {
  flex: 1 1 280px; background: var(--bg2); border-radius: var(--r); padding: 22px 24px;
}
.price-says b { display: block; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.price-says p { margin: 0; font-size: 16px; }

/* choice pills, for how often listeners pay */
.choices { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.choice {
  font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
  background: var(--bg); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: var(--pill); padding: 12px 24px;
}
.choice:hover { border-color: var(--ink3); }
.choice[aria-pressed="true"] {
  background: var(--deep); color: var(--on-deep); border-color: var(--deep);
}

.payout-says { margin: 16px 0 0; font-size: 16px; color: var(--ink2); }

/* splits */
.split-bar {
  height: 11px; border-radius: var(--pill); background: var(--bg2);
  overflow: hidden; display: flex; margin: 22px 0 10px;
}
.split-bar i { display: block; height: 100%; background: var(--orange); }
.split-bar i:nth-child(even) { background: #f9a066; }
.split-sum { font-size: 17px; margin-bottom: 18px; }
.split-sum b { font-weight: 700; }
.split-sum.ok b, .split-sum.ok em { color: var(--good); font-style: normal; }
.split-sum.off b, .split-sum.off em { color: var(--bad); font-style: normal; }
.split-sum em { font-size: 16px; font-weight: 400; margin-left: 8px; }

.payee {
  background: var(--bg2); border-radius: var(--r); padding: 18px 20px; margin-bottom: 14px;
}
.payee-top { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.payee-top .swatch { width: 14px; height: 14px; border-radius: 4px; background: var(--orange); flex: none; }
.payee-top .swatch.two { background: #f9a066; }
.payee-top input { background: var(--bg); }
.payee-split { display: flex; gap: 14px; align-items: flex-end; }
.payee-split .where { flex: 1 1 260px; min-width: 0; }
.payee-split .share { flex: 0 0 120px; }
.payee-split input { background: var(--bg); }
.payee-split .pct { display: flex; align-items: center; gap: 8px; }
.payee-split .pct span { font-size: 16px; color: var(--ink3); }
.payee-earns { font-size: 15px; color: var(--ink3); margin: 12px 0 0; }

/* the publish card at the foot of settings */
.publish-card {
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px; flex-wrap: wrap;
}
.publish-card div { flex: 1 1 320px; min-width: 0; }
.publish-card h2 { margin-bottom: 4px; }
.publish-card p { margin: 0; }

/* ── earnings tab ─────────────────────────────────────────────────── */

.nothing { max-width: 720px; }
.nothing h2 { font-size: clamp(30px, 3.6vw, 44px); letter-spacing: -0.035em; margin-bottom: 14px; }
.nothing > p { font-size: 18px; max-width: 32em; }
.steps { list-style: none; padding: 0; margin: 26px 0; display: grid; gap: 12px; }
.steps li {
  display: flex; align-items: center; gap: 18px;
  background: var(--bg2); border-radius: var(--r); padding: 18px 22px; font-size: 17px;
}
.steps .n { font-weight: 800; color: var(--orange); flex: none; }
.steps .t { flex: 1; font-weight: 600; }
.steps .s { font-family: var(--mono); font-size: 13.5px; color: var(--ink3); }

.copy-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 22px; }
.copy-row code {
  font-family: var(--mono); font-size: 14.5px; color: var(--ink3); overflow-wrap: anywhere;
}


/* ── the player bar ───────────────────────────────────────────────── */

.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: var(--deep); color: var(--on-deep);
  padding: 0 0 env(safe-area-inset-bottom, 0px);
}
.player-in {
  max-width: var(--col); margin: 0 auto; padding: 14px var(--gut);
  display: flex; align-items: center; gap: 18px;
}
.player .play { border-color: var(--on-deep); background: transparent; color: var(--on-deep); }
.player .play:hover { background: var(--on-deep); color: var(--deep); }
.player .what { flex: 1 1 auto; min-width: 0; }
.player .what b { display: block; font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .what span { font-family: var(--mono); font-size: 12.5px; color: rgba(250, 247, 245, 0.6); }
.player .time { font-family: var(--mono); font-size: 13px; color: rgba(250, 247, 245, 0.6); flex: none; font-variant-numeric: tabular-nums; }
.player .close { background: none; border: 0; color: rgba(250, 247, 245, 0.6); cursor: pointer; font-size: 18px; padding: 6px; }
.player .close:hover { color: var(--on-deep); }
.player-track { height: 3px; background: rgba(250, 247, 245, 0.18); }
.player-track i { display: block; height: 100%; background: var(--orange); }

/* ── phone ────────────────────────────────────────────────────────── */

@media (max-width: 700px) {
  /* The header: logo, a short status and Publish on one row, the tabs on the
     next, and nothing else. It stays pinned, so every row here is a row of
     screen the artist does not get back. */
  .top-in { padding: 10px var(--gut); gap: 10px; }
  .top-mark .mark { font-size: 21px; gap: 8px; }
  .top-mark .mark svg { width: 22px; height: 22px; }
  .top-mark .where { display: none; }
  .top-right { flex-wrap: nowrap; gap: 8px; }
  .state { padding: 7px 12px; font-size: 14px; gap: 7px; white-space: nowrap; }
  .state .long, .publish .long { display: none; }
  .state .short, .publish .short { display: inline; }
  .top .btn.sm { font-size: 15px; padding: 10px 18px; }

  .tabs-in { padding: 0 calc(var(--gut) - 10px); }
  .tablist { gap: 0; width: 100%; justify-content: space-between; }
  .tab { font-size: 16.5px; padding: 11px 10px 9px; }
  .tabs-right { display: none; }

  /* The links the header gave up, at the top of the page instead. */
  .page-links {
    display: flex; flex-wrap: wrap; gap: 10px 20px; margin: -20px 0 22px;
  }
  .page { padding-top: 34px; }

  /* The cover and the date and price share the top row; the title goes under. */
  .release-head { grid-template-columns: auto minmax(0, 1fr); padding: 20px; gap: 14px 16px; }
  .release-fields { grid-column: 1 / -1; grid-row: 2; }
  .release-side { grid-column: 2; grid-row: 1; justify-items: stretch; align-content: start; }
  .side-field { grid-template-columns: 1fr; gap: 4px; }
  .side-field .label { text-align: left; }
  .release-side, .side-field { min-width: 0; }
  .side-field input[type=date] {
    width: 100%; min-width: 0; box-sizing: border-box; display: block; -webkit-appearance: none; appearance: none;
  }
  .side-field input[type=date]::-webkit-date-and-time-value { text-align: left; }
  .release-price { display: flex; }
  .release-price input { flex: 1; min-width: 0; width: auto; }
  /* Artwork stays square, as it will be everywhere else it is shown. */
  .release-art { width: 120px; height: 120px; }
  .track-panel { margin: 0 16px 12px; }
  /* On a phone the title needs the room: Edit is a pencil, and the length goes. */
  .track-edit-btn { width: 36px; height: 36px; padding: 0; font-size: 17px; display: grid; place-items: center; }
  .track-edit-btn .edit-word { display: none; }
  .track-edit-btn .edit-icon { display: inline; }

  /* Two lines: the title, and under it what's set. */
  .track-row {
    display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto;
    column-gap: 8px; row-gap: 6px; padding: 12px 16px;
  }
  .track-row > .track-order, .track-row > .play, .track-row > .track-edit-btn { grid-row: 1 / span 2; }
  .track-row > .track-title { grid-column: 3; grid-row: 1; }
  .track-tags { grid-column: 3; grid-row: 2; display: flex; align-items: center; gap: 8px; padding-left: 6px; flex-wrap: wrap; }
  .track-tags .warn-toggle { width: 24px; height: 24px; font-size: 13px; line-height: 24px; }
  .track-title { flex: 1 1 0; min-width: 0; padding: 8px 6px; font-size: 16px; }
  .play { width: 36px; height: 36px; }
  .track-dur { font-size: 13px; }
  .track-row .icon:not(.stack2) { width: 32px; height: 32px; }
  .dropzone, .track-problem, .track-warn { margin-left: 20px; margin-right: 20px; width: calc(100% - 40px); }
  .price-now .price-input, .price-now .unit { font-size: 44px; }
  .link-row { flex-wrap: wrap; }
  .link-row .what, .link-row .where { flex: 1 1 100%; }
  .payee-split { flex-wrap: wrap; }
  .payee-split .where { flex-basis: 100%; }
  .card { padding: 20px; }
  .profile, .release { padding: 0; }
  .profile-fields { padding: 20px; }
  .avatar-wrap { padding: 0 20px; }
  .page-head h1 { font-size: 30px; }
  .page .page-head { margin-bottom: 18px; }
  .choice { font-size: 16px; padding: 10px 18px; }

  /* The links the header gave up, as a row of small pills. */
  .page-links { gap: 8px; margin: -18px 0 20px; }
  .page-links .quiet-link {
    border: 1px solid var(--line); border-radius: var(--pill); padding: 7px 13px;
    font-size: 14px; text-decoration: none; background: var(--bg);
  }
  .release-price input { width: 110px; }

  /* Listeners as cards: a table this wide can't be read on a phone. */
  table.listeners, table.listeners tbody, table.listeners tr, table.listeners td { display: block; width: 100%; }
  table.listeners thead { display: none; }
  table.listeners tr { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; }
  table.listeners td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; gap: 12px; }
  table.listeners td[data-k]::before { content: attr(data-k); color: var(--ink3); font-size: 13px; font-family: var(--mono); }
  table.listeners td.row-do { justify-content: flex-start; padding-top: 8px; }
}

/* The DNS record to copy: three labelled lines, the value allowed to wrap. */
.dns-record { display: grid; gap: 10px; background: var(--bg2); border-radius: var(--r); padding: 16px 18px; margin: 12px 0 16px; }
.dns-record > div { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.dns-record .k { flex: 0 0 110px; font-size: 13px; color: var(--ink3); font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.dns-record code { font-family: var(--mono); font-size: 14.5px; }
.dns-record code.v { word-break: break-all; flex: 1 1 260px; }
.where-dns { margin: 0 0 16px; font-size: 15.5px; }
.where-dns summary { cursor: pointer; font-weight: 600; }
.where-dns ul { padding-left: 18px; display: grid; gap: 6px; margin: 10px 0; }
.dns-check { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.dns-said { font-size: 15px; color: var(--ink2); }
.dns-said.ok { color: var(--good); font-weight: 600; }

/* Filling the artist's own address from Phantom, under the first row only. */
.from-phantom { display: block; margin: -6px 0 12px; font-size: 14.5px; }

/* Subscription plans: a tick, a name, a price, one row each. */
.plans { display: grid; gap: 10px; margin: 16px 0; }
.plan { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 16px; }
.plan .plan-name { flex: 1 1 140px; }
.plan .plan-price { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); }
.plan .plan-price input { width: 90px; font: inherit; padding: 8px 10px; border-radius: var(--r);
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.plan .plan-price input:disabled { opacity: .45; }

</style>
</head>

<div class="wrap" id="app">
  <p class="lead">Loading…</p>
  <noscript><p>This page needs JavaScript to edit your music.</p></noscript>
