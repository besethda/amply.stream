<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your music</title>
<meta name="robots" content="noindex">
<style>
:root {
  --ink: #17161a;
  --ink-2: #55525c;
  --muted: #8a8792;
  --bg: #fbfaf8;
  --surface: #ffffff;
  --rule: #e6e3dd;
  --accent: #b5482a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #f2f0ec; --ink-2: #b4b0a8; --muted: #86827c;
    --bg: #131215; --surface: #1b1a1e; --rule: #2c2a30; --accent: #e0714d;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: 0 20px 96px;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 660px; margin: 0 auto; }
header { padding: 56px 0 40px; border-bottom: 1px solid var(--rule); margin-bottom: 40px; }
.mark {
  display: inline-block; font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
  color: var(--ink); text-decoration: none;
}
.mark span { color: var(--accent); }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; margin: 28px 0 10px; }
.updated { color: var(--muted); font-size: 13px; margin: 0; }
h2 {
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin: 44px 0 14px; font-weight: 600;
}
p { margin: 0 0 16px; color: var(--ink-2); }
p.lead { font-size: 18px; color: var(--ink); }
strong { color: var(--ink); font-weight: 600; }
ul { margin: 0 0 16px; padding-left: 20px; color: var(--ink-2); }
li { margin-bottom: 9px; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.box {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: 8px; padding: 18px 20px; margin: 0 0 20px;
}
.box p:last-child { margin-bottom: 0; }
footer {
  margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--rule);
  color: var(--muted); font-size: 14px;
}
footer a { color: var(--muted); }

/* Functional pass. Layout and states first; a visual pass comes later. */
  body { padding-bottom: 96px; }
  .card {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    padding: 22px; margin: 0 0 20px;
  }
  .card h2 { margin: 0 0 6px; font-size: 18px; color: var(--ink);
             text-transform: none; letter-spacing: 0; font-weight: 600; }
  .card h3 { margin: 24px 0 10px; font-size: 13px; text-transform: uppercase;
             letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .card > p:first-of-type { margin-top: 0; }
  .muted { color: var(--muted); font-size: 14px; font-weight: 400; }

  .field { display: block; margin: 0 0 16px; }
  .field-label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  .field-hint { display: block; font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  input[type=text], input[type=number], input[type=date], textarea {
    width: 100%; font: inherit; font-size: 15px; padding: 10px 12px;
    border: 1px solid var(--rule); border-radius: 7px;
    background: var(--bg); color: var(--ink);
  }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  input:disabled { color: var(--muted); }
  textarea { resize: vertical; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
  .row > .field { flex: 1 1 200px; margin-bottom: 16px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }

  .btn { display: inline-flex; align-items: center; gap: 7px; font: inherit;
         font-weight: 600; font-size: 14.5px; background: var(--accent); color: #fff;
         border: 0; padding: 11px 18px; border-radius: 7px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); font-weight: 500; }
  .btn.block { display: block; width: 100%; text-align: left; margin-bottom: 10px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .link { background: none; border: 0; font: inherit; font-size: 13.5px; color: var(--muted);
          cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }
  .link.danger { color: #c0392b; }
  .icon { background: none; border: 1px solid var(--rule); border-radius: 5px;
          width: 26px; height: 22px; cursor: pointer; color: var(--ink-2); font-size: 12px; line-height: 1; }
  .icon[disabled] { opacity: .3; cursor: not-allowed; }
  .checkbox { display: inline-flex; align-items: center; gap: 8px; font-size: 14px;
              color: var(--ink-2); cursor: pointer; }
  .checkbox input { width: auto; }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 16px;
         flex-wrap: wrap; padding: 18px 0 20px; border-bottom: 1px solid var(--rule); margin-bottom: 24px; }
  .bar-actions { display: flex; align-items: center; gap: 14px; }
  .node-url { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }

  .banner { padding: 12px 16px; border-radius: 8px; margin: 0 0 20px; font-size: 14.5px;
            display: flex; justify-content: space-between; gap: 14px; align-items: center; }
  .banner.ok { background: rgba(12,163,12,.12); color: var(--ink); }
  .banner.error { background: rgba(208,59,59,.12); color: var(--ink); }

  .release { border: 1px solid var(--rule); border-radius: 9px; padding: 18px; margin: 0 0 16px; }
  .release-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .release-title { font-weight: 600; font-size: 16px; }
  .tracks { list-style: none; padding: 0; margin: 0 0 14px; }
  .track { display: flex; gap: 14px; align-items: center; padding: 12px 0;
           border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .track:last-child { border-bottom: 0; }
  .track-order { display: flex; flex-direction: column; gap: 3px; }
  .track-main { flex: 1 1 220px; min-width: 0; }
  .track-meta { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); margin-top: 5px; flex-wrap: wrap; }
  .track-actions { display: flex; gap: 14px; align-items: center; }
  .tag { background: var(--rule); padding: 1px 7px; border-radius: 4px; }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
  .foot { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--rule); }

</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="lead">Loading…</p>
  <noscript><p>This page needs JavaScript to edit your music.</p></noscript>
</div>
