<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amply</title>
<meta name="description" content="Listen to artists who host their own music, and pay them directly.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The fonts' stylesheet is added by the app (main.jsx), not here: a
     stylesheet in the head holds up the first paint, and on a slow connection
     that meant a blank screen instead of the logo below. -->
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/app/app.css">
<style>
  /* The logo, while the app starts and checks it's the latest version.
     Inline, so it shows at once, without a connection. */
  #splash { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    background: #0f0d0c; transition: opacity .28s ease; }
  /* The animated logo (made in EffectCraft as "Amply Loader"): its box is wider
     than the logo, for the rings, so the logo itself stays 76px across. */
  #splash svg { width: 104px; height: auto; }
  #splash.gone { opacity: 0; pointer-events: none; }
</style>
</head>
